# Сборка и публикация marketgame.biz на GitHub Pages.
#
# Когда запускается:
#   - при каждом изменении ветки main;
#   - раз в час — забрать свежие статусы палат и банков из таблицы продаж
#     (scripts/sync-sheet.mjs). Если в таблице ничего не поменялось,
#     сайт не пересобирается;
#   - вручную: Actions → Build and deploy → Run workflow.
#
# Секреты (Settings → Secrets and variables → Actions):
#   CHAMBERS_CSV_URL — опубликованный CSV листа с палатами
#   BANKS_CSV_URL    — опубликованный CSV листа с банками
# Пока секретов нет, сайт просто собирается с текущими данными.

name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync chambers and banks from the sales sheet
        id: sync
        env:
          CHAMBERS_CSV_URL: ${{ secrets.CHAMBERS_CSV_URL }}
          BANKS_CSV_URL: ${{ secrets.BANKS_CSV_URL }}
        run: node scripts/sync-sheet.mjs

      # Изменения базы сохраняем в репозитории: так видна история статусов
      - name: Commit updated data
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/chambers.json src/_data/banks.json
          git commit -m "Update chambers and banks from the sales sheet"
          git push

      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.decide.outputs.publish == 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.publish == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
